<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">
  <script>
    // Dynamically align base href for both subpath (/ride/) and root (/) hosting
    (function() {
      var base = document.querySelector('base');
      if (base) {
        var p = window.location.pathname;
        if (p.indexOf('/ride') === 0) {
          base.setAttribute('href', '/ride/');
        } else if (p === '/' || p === '') {
          base.setAttribute('href', '/');
        }
      }
    })();
  </script>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="DIU Ride - Smart Peer Carpooling and Motorcycle Rides for Daffodil International University">

  <!-- Performance & Mobile GPU Acceleration Styling -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
    }
    #loading {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      width: 100%;
      background-color: #ffffff;
      color: #E65100;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3.5px solid #FFE0B2;
      border-top-color: #E65100;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DIU Ride">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Preconnect to CDNs for 120Hz CanvasKit & Font asset speed -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://www.gstatic.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <title>DIU Ride</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD-hl4Vshm6lqgUopu4rHbwmUbbPNA7kfA" defer></script>
  <!-- Firebase JS SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-analytics.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCSOpUBZYClVhratJeK-OTRhypoRdTTjfk",
      authDomain: "diuride252.firebaseapp.com",
      projectId: "diuride252",
      storageBucket: "diuride252.firebasestorage.app",
      messagingSenderId: "848215124719",
      appId: "1:848215124719:web:aa6543bbb965882fb0491a",
      measurementId: "G-78EWC052SB"
    };

    const app = initializeApp(firebaseConfig);
    try { getAnalytics(app); } catch (e) {}
    window.firebaseApp = app;
  </script>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
  </div>
  <script src="flutter_bootstrap.js?v=prod_build_senior_release_v5" async></script>
</body>
</html>
