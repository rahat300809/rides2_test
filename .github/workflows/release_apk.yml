name: Release Android APK (Version-wise)

on:
  push:
    tags:
      - 'v*' # Triggers on tags like v1.0.8, v1.0.9, v2.0.0
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version Tag (e.g. v1.0.9)'
        required: true
        default: 'v1.0.9'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java Development Kit (JDK) 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Verify Code Quality (Analyze)
        run: flutter analyze

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Prepare Versioned APK Artifacts
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [[ "$TAG_NAME" != v* ]]; then
            TAG_NAME="${{ github.event.inputs.version_tag }}"
          fi
          if [ -z "$TAG_NAME" ]; then
            TAG_NAME="v1.0.9"
          fi
          
          mkdir -p release-artifacts
          cp build/app/outputs/flutter-apk/app-release.apk release-artifacts/diu_ride.apk
          cp build/app/outputs/flutter-apk/app-release.apk release-artifacts/diu_ride-${TAG_NAME}.apk

      - name: Create GitHub Release with APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.version_tag }}
          name: "DIU Ride ${{ github.ref_name || github.event.inputs.version_tag }}"
          body: |
            ## 🚴 DIU Ride Commute Release (${{ github.ref_name || github.event.inputs.version_tag }})
            
            ### 🚀 Highlights & Changelog
            - **Consistent Minimal UI Design**: Clean theme alignment across Passenger & Biker views.
            - **Real-time Ride Discovery**: Fully verified feed with flexible departure times.
            - **Booking History Management**: Direct "Dismiss" capability for finished/cancelled bookings.
            - **Optimized Communication**: Direct in-app chat & background synchronization.
            
            ### 📥 Download Options
            - **Official Release**: [`diu_ride.apk`](https://github.com/rahat300809/Diu_Rides/releases/download/${{ github.ref_name || github.event.inputs.version_tag }}/diu_ride.apk)
            - **Version Tagged**: [`diu_ride-${{ github.ref_name || github.event.inputs.version_tag }}.apk`](https://github.com/rahat300809/Diu_Rides/releases/download/${{ github.ref_name || github.event.inputs.version_tag }}/diu_ride-${{ github.ref_name || github.event.inputs.version_tag }}.apk)
          files: |
            release-artifacts/diu_ride.apk
            release-artifacts/diu_ride-*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

